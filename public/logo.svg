<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-label="CardFolio — business card, portfolio, QR code">
  <title>CardFolio</title>
  <!--
    Stacked lockup: mark, wordmark, tagline rule. "Card" is set in the dark
    ink, "Folio" in the brand gradient.

    The wordmark and tagline are live text in the system UI stack, not
    outlines: correct in any browser, but convert to paths before sending this
    to a printer, who will not have the viewer's fonts.
  -->
  <defs>
    <linearGradient id="cfBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B6BF5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="cfWord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B6BF5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <g transform="translate(116 10) scale(2)">
    <rect x="30" y="11" width="26" height="42" rx="6" fill="url(#cfBrand)"/>
    <g fill="#ffffff">
      <path d="M34 16h7v7h-7zm1.6 1.6v3.8h3.8v-3.8z" fill-rule="evenodd"/>
      <path d="M46 16h7v7h-7zm1.6 1.6v3.8h3.8v-3.8z" fill-rule="evenodd"/>
      <path d="M34 28h7v7h-7zm1.6 1.6v3.8h3.8v-3.8z" fill-rule="evenodd"/>
      <rect x="43" y="25.5" width="2" height="2"/>
      <rect x="46.5" y="25.5" width="2" height="2"/>
      <rect x="50" y="27.5" width="2" height="2"/>
      <rect x="43.5" y="29" width="2" height="2"/>
      <rect x="47" y="30.5" width="2" height="2"/>
      <rect x="50.5" y="32" width="2" height="2"/>
      <rect x="43" y="33" width="2" height="2"/>
      <rect x="46.5" y="34.5" width="2" height="2"/>
      <rect x="34" y="38" width="2" height="2"/>
      <rect x="37.5" y="38" width="2" height="2"/>
      <rect x="41" y="39.5" width="2" height="2"/>
      <rect x="44.5" y="38" width="2" height="2"/>
      <rect x="48" y="39.5" width="2" height="2"/>
    </g>

    <rect x="8" y="7" width="32" height="46" rx="6" fill="#111A2E"/>
    <circle cx="20.5" cy="20" r="4.6" fill="url(#cfBrand)"/>
    <path d="M13.6 32.4a6.9 6.9 0 0 1 13.8 0z" fill="url(#cfBrand)"/>
    <rect x="13.6" y="35.6" width="15.5" height="2.6" rx="1.3" fill="url(#cfBrand)"/>
    <rect x="13.6" y="40" width="10.5" height="2.6" rx="1.3" fill="url(#cfBrand)"/>
    <g fill="none" stroke="url(#cfBrand)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18.4 45.4 16 47.8l2.4 2.4"/>
      <path d="m26 45.4 2.4 2.4-2.4 2.4"/>
      <path d="M23.6 44.6 20.8 51"/>
    </g>
  </g>

  <text x="180" y="232" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="54" font-weight="700" letter-spacing="-1.4" fill="#111A2E">Card<tspan fill="url(#cfWord)">Folio</tspan></text>

  <g stroke="#5b6b8c" stroke-width="1.6" stroke-linecap="round">
    <path d="M42 262h26"/>
    <path d="M292 262h26"/>
  </g>
  <text x="180" y="267" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="13.5" font-weight="600" letter-spacing="1.6" fill="#3f4c68">BUSINESS CARD • PORTFOLIO • QR CODE</text>
</svg>
